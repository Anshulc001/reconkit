[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconkit"
version = "1.0.0"
description = "Reconnaissance orchestrator for authorized security testing"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Anshul"}]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
reconkit = "reconkit.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The ffuf adapter ships with an inline content-discovery wordlist (D13,
# 2026-11-17); it must be importable data, not a file next to the checkout.
[tool.setuptools.package-data]
reconkit = ["data/*.txt", "data/wordlists/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]   # Markdown examples are contracts, not runnable code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # pytest uses asserts
"tests/fakebin/**" = ["S603"]   # fixtures start their own child process
"tests/test_runner.py" = ["S603"]   # the kill-tree test must hold a live Popen to call _kill_tree
"tests/test_binary_adapters.py" = ["S603"]   # the SIGKILL test spawns a python child that kills itself
"src/reconkit/core/runner.py" = ["S603"]   # argv is validated; sole subprocess entry
"src/reconkit/adapters/nmap.py" = ["S314"]   # parses only the -oX file nmap itself wrote in this run

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: real-tool smoke tests (Kali/Ubuntu only, authorized targets)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/reconkit"]
