# reconkit tool registry. The ONLY list of tools the program may run.
# Fields: stage, kind (http|python|binary), tier (core|opt_in|intrusive), mode (passive|active),
#   phase (build phase: 2 = working adapter in Phase 2, 3 = later), binary, version_cmd,
#   version_regex, source,
#   keys (optional list of {env,url,adds} for keys that are free to obtain; policy in docs/05_SECURITY.md 6.1).
# `keys` is the only per-tool key field; there is no `needs_key` (the loader rejects it).
# `source` is provenance only - where this tool's upstream project lives. reconkit does not
# install or download anything; `source` is never executed and is shown only in
# docs/10_TOOL_SOURCES.md.
# `class` (D48) names the tool's runtime class; config.yaml `runtime_caps:` gives that class a
#   floor, a per-host scale and an idle kill. No class = no cap. A new tool of an existing class
#   needs this one field and nothing in engine.py.
# `external: true` (D47) marks a tool whose requests all go to a third party's API, so a
#   whole-response HTTP 404 is that service being wrong (a gap), never a failure of the scan.
version: 1

stages:
  subs:  {mode: passive, desc: "Subdomain discovery (union of sources)"}
  dns:   {mode: passive, desc: "DNS resolution, wildcard filtering, CNAME/NS hygiene"}
  live:  {mode: active,  desc: "ALIVE / DNS_ONLY / SHUT_DOWN / DEAD classification"}
  ports: {mode: active,  desc: "Open ports and service fingerprints (plus passive port data)"}
  tech:  {mode: active,  desc: "Technology, WAF and CDN detection"}
  urls:  {mode: active,  desc: "Historical and crawled URLs, parameters, JS files"}
  vulns: {mode: active,  desc: "Takeover and exposure/misconfiguration checks"}
  shots: {mode: active,  desc: "Screenshots (opt-in)"}

tools:
  # ---------------- subs (passive) ----------------
  crtsh:        {stage: subs, kind: http, tier: core, mode: passive, phase: 2, class: api, external: true, notes: "Certificate Transparency via crt.sh JSON. Rate-limit friendly in slow mode."}
  certspotter:
    stage: subs
    kind: http
    tier: core
    mode: passive
    phase: 2
    class: api
    external: true
    keys:
      - env: CERTSPOTTER_API_KEY
        url: "https://sslmate.com/ct_search_api"
        adds: "Free Cert Spotter account: an API key authenticates queries as a Bearer token; unauthenticated queries are limited per hour and intended only for evaluation."
    notes: "Key optional (authenticated access)."
  otx:
    stage: subs
    kind: http
    tier: core
    mode: passive
    phase: 2
    class: api
    external: true
    keys:
      - env: OTX_API_KEY
        url: "https://otx.alienvault.com/"
        adds: "Free OTX account: authenticated passive DNS with higher limits; anonymous requests are rate limited."
    notes: "AlienVault OTX passive DNS. Key optional."
  hackertarget: {stage: subs, kind: http, tier: core, mode: passive, phase: 2, class: api, external: true, notes: "Free tier has a low daily limit; treat HTTP 429 as skipped."}
  urlscan:
    stage: subs
    kind: http
    tier: core
    mode: passive
    phase: 3
    class: api
    external: true
    keys:
      - env: URLSCAN_API_KEY
        url: "https://urlscan.io/user/signup"
        adds: "Free urlscan.io account: creates the API key used for submissions; unauthenticated API access has only minor quotas."
  subfinder:
    stage: subs
    kind: binary
    tier: core
    mode: passive
    phase: 2
    binary: subfinder
    version_cmd: [subfinder, -version]
    source: "https://github.com/projectdiscovery/subfinder/releases (or: go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest)"
    keys:
      - env: CERTSPOTTER_API_KEY
        url: "https://sslmate.com/ct_search_api"
        adds: "Adds the certspotter provider to subfinder (also used by the certspotter adapter)."
      - env: PDCP_API_KEY
        url: "https://cloud.projectdiscovery.io"
        adds: "Adds the chaos provider to subfinder (free ProjectDiscovery Cloud key)."
      - env: GITHUB_TOKEN
        url: "https://github.com/settings/tokens"
        adds: "Adds the github provider to subfinder."
      - env: VT_API_KEY
        url: "https://www.virustotal.com/gui/join-us"
        adds: "Adds the virustotal provider to subfinder (4 requests/minute, 500/day)."
    notes: "Provider keys are written to a temporary provider-config.yaml by the adapter; never on the command line."
  assetfinder:
    stage: subs
    kind: binary
    tier: core
    mode: passive
    phase: 2
    binary: assetfinder
    version_cmd: [assetfinder, -h]
    source: "go install github.com/tomnomnom/assetfinder@latest"
    keys:
      - env: VT_API_KEY
        url: "https://www.virustotal.com/gui/join-us"
        adds: "Free VirusTotal Public API key: adds the virustotal source (4 requests/minute, 500/day)."
  amass:        {stage: subs, kind: binary, tier: core, mode: passive, phase: 3, binary: amass, version_cmd: [amass, -version], source: "apt: amass", notes: "v5.1.3: enum prints ONLY the Session Scope header (findings go to its engine), so the adapter reads them back with `amass subs -d DOMAIN -names` via post_command - without it amass reports 1 item, the target. -o does not exist (-oA/-dir do; -dir writes config templates only). passive is the default; enum -passive still parses but is deprecated. Slow - keep it last. v5 CLI: assoc|engine|enum|subs|track|viz."}
  findomain:    {stage: subs, kind: binary, tier: core, mode: passive, phase: 3, binary: findomain, version_cmd: [findomain, --version], source: "apt: findomain", notes: "Kali packages 11.0.0-beta.2 (apt-cache policy, 2026-11-18), so no unverified zip is needed; the beta prints bare subdomains for `-t example.com -q`, exit 0, which is what the adapter parses. The GitHub release zip (findomain-linux.zip) stays the fallback for non-Debian systems."}
  chaos:
    stage: subs
    kind: binary
    class: api
    external: true
    tier: core
    mode: passive
    phase: 3
    binary: chaos
    version_cmd: [chaos, -version]
    version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)'
    source: "https://github.com/projectdiscovery/chaos-client/releases (or: go install github.com/projectdiscovery/chaos-client/cmd/chaos@latest; the archive member is chaos-client)"
    keys:
      - env: PDCP_API_KEY
        url: "https://cloud.projectdiscovery.io"
        adds: "Free ProjectDiscovery Cloud account: API key for the Chaos dataset (60 requests/minute per IP)."
  github_subdomains:
    stage: subs
    kind: binary
    class: api
    external: true
    tier: core
    mode: passive
    phase: 3
    binary: github-subdomains
    source: "go install github.com/gwen001/github-subdomains@latest"
    keys:
      - env: GITHUB_TOKEN
        url: "https://github.com/settings/tokens"
        adds: "Free GitHub personal access token: raises the API limit from 60 to 5,000 requests/hour; the tool reads GITHUB_TOKEN."

  # ---------------- dns ----------------
  dnspython:    {stage: dns, kind: python, tier: core, mode: passive, phase: 2, notes: "A/AAAA/CNAME/NS/MX/TXT, wildcard probe, dangling CNAME check."}
  dnsx:         {stage: dns, kind: binary, tier: core, mode: passive, phase: 3, binary: dnsx, version_cmd: [dnsx, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/dnsx/releases (or: go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest)"}
  puredns:      {stage: dns, kind: binary, tier: core, mode: passive, phase: 3, binary: puredns, version_cmd: [puredns, --version], source: "go install github.com/d3mondev/puredns/v2@latest (also needs massdns)"}
  massdns:      {stage: dns, kind: binary, tier: core, mode: passive, phase: 3, binary: massdns, version_cmd: [dpkg-query, -W, '-f=${Version}', massdns], source: "apt: massdns"}
  dig:          {stage: dns, kind: binary, tier: core, mode: passive, phase: 3, binary: dig, version_cmd: [dig, -v], source: "apt: dnsutils (provides dig)"}

  # ---------------- live (active) ----------------
  pyprobe:      {stage: live, kind: python, tier: core, mode: active, phase: 2, notes: "Async HTTP/HTTPS probe, status, title, redirects. Fallback when no binary is installed."}
  httpx:        {stage: live, kind: binary, tier: core, mode: active, phase: 2, binary: httpx, version_cmd: [httpx, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/httpx/releases (or: go install github.com/projectdiscovery/httpx/cmd/httpx@latest; Kali's apt package is httpx-toolkit; the python 'httpx' CLI is a different program)", notes: "ProjectDiscovery httpx. Always use ~/.reconkit/bin first."}
  httprobe:     {stage: live, kind: binary, tier: core, mode: active, phase: 3, binary: httprobe, source: "go install github.com/tomnomnom/httprobe@latest"}
  tlsx:         {stage: live, kind: binary, tier: core, mode: active, phase: 3, binary: tlsx, version_cmd: [tlsx, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/tlsx/releases (or: go install github.com/projectdiscovery/tlsx/cmd/tlsx@latest)", notes: "Certificate SANs can reveal more subdomains."}

  # ---------------- ports ----------------
  smap:         {stage: ports, kind: binary, tier: core, mode: passive, phase: 3, binary: smap, version_cmd: [smap, -h], version_regex: 'Smap (\S+)', source: "go install github.com/s0md3v/smap/cmd/smap@latest", notes: "Passive ports from Shodan data. No packets to the target."}
  pyscan:       {stage: ports, kind: python, tier: core, mode: active, phase: 2, notes: "Async TCP connect scan (no root). Fallback and verifier."}
  naabu:        {stage: ports, kind: binary, tier: core, mode: active, phase: 2, binary: naabu, version_cmd: [naabu, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', requires_apt: [libpcap-dev], source: "https://github.com/projectdiscovery/naabu/releases (or: go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest; needs libpcap-dev; use connect scan -scan-type c when not root)", notes: "Needs libpcap."}
  nmap:         {stage: ports, kind: binary, tier: core, mode: active, phase: 3, binary: nmap, version_cmd: [nmap, --version], source: "apt: nmap", notes: "Service/version verification (-sV)."}
  rustscan:     {stage: ports, kind: binary, tier: core, mode: active, phase: 3, binary: rustscan, version_cmd: [rustscan, --version], version_regex: '^rustscan (\d+\.\d+\.\d+)$', source: "apt: rustscan", notes: "Kali packages it as 2.4.1-0kali1 while the binary self-reports `rustscan 2.3.0` (2026-11-18); the regex still matches and -a/-g/-n/--ulimit/--top are all in its --help. Falls back to the release .deb; the 2.3.0 pin in config.yaml is ignored (accepted-and-ignored, 2026-11-17)."}
  masscan:      {stage: ports, kind: binary, tier: opt_in, mode: active, phase: 3, binary: masscan, version_cmd: [masscan, --version], needs_root: true, source: "apt: masscan", notes: "Opt-in only."}

  # ---------------- tech ----------------
  httpx_tech:   {stage: tech, kind: binary, tier: core, mode: active, phase: 3, binary: httpx, version_cmd: [httpx, -version], version_regex: 'Current Version:\s*v?([0-9]+\.[0-9]+\.[0-9]+)', waf_priority: 20, source: "https://github.com/projectdiscovery/httpx/releases (same binary as httpx; this row reuses it with -td)", notes: "httpx -td technology detection (reuses httpx). The probe is what keeps the python 'httpx' CLI from counting as installed."}
  whatweb:      {stage: tech, kind: binary, tier: core, mode: active, phase: 3, binary: whatweb, version_cmd: [whatweb, --version], waf_priority: 50, source: "apt: whatweb"}
  wafw00f:      {stage: tech, kind: binary, tier: core, mode: active, phase: 3, binary: wafw00f, version_cmd: [wafw00f, --version], version_regex: 'WAFW00F you have is[^\n]*?(v?\d+\.\d+\.\d+)', waf_priority: 100, source: "pipx install wafw00f"}
  cdncheck:     {stage: tech, kind: binary, tier: core, mode: passive, phase: 3, binary: cdncheck, version_cmd: [cdncheck, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', waf_priority: 80, source: "https://github.com/projectdiscovery/cdncheck/releases (or: go install github.com/projectdiscovery/cdncheck/cmd/cdncheck@latest)", notes: "Detects CDN/WAF by IP range so a CDN block is not mistaken for a dead host."}
  webanalyze:   {stage: tech, kind: binary, tier: core, mode: active, phase: 3, binary: webanalyze, source: "go install github.com/rverton/webanalyze/cmd/webanalyze@latest", notes: "Needs `webanalyze -update` once per working directory first: it writes technologies.json (~2.1 MB) into the CWD, and a scan without it exits 1 (can not open apps file). Point -apps elsewhere to reuse one file."}

  # ---------------- urls ----------------
  gau:          {stage: urls, kind: binary, tier: core, mode: passive, phase: 3, class: crawler, binary: gau, version_cmd: [gau, --version], version_regex: 'gau version: (\d+\.\d+\.\d+)', source: "go install github.com/lc/gau/v2/cmd/gau@latest"}
  waybackurls:  {stage: urls, kind: binary, tier: core, mode: passive, phase: 3, binary: waybackurls, source: "go install github.com/tomnomnom/waybackurls@latest"}
  katana:       {stage: urls, kind: binary, tier: core, mode: active, phase: 3, class: crawler, binary: katana, version_cmd: [katana, -version], version_regex: 'Current version: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/katana/releases (or: go install github.com/projectdiscovery/katana/cmd/katana@latest)"}
  hakrawler:    {stage: urls, kind: binary, tier: core, mode: active, phase: 3, class: crawler, binary: hakrawler, source: "go install github.com/hakluke/hakrawler@latest"}
  gospider:     {stage: urls, kind: binary, tier: core, mode: active, phase: 3, class: crawler, binary: gospider, version_cmd: [gospider, --version], version_regex: 'Version: (\S+)', source: "go install github.com/jaeles-project/gospider@latest"}
  subjs:        {stage: urls, kind: binary, tier: core, mode: active, phase: 3, binary: subjs, version_cmd: [subjs, -version], version_regex: 'subjs version: (\S+)', source: "go install github.com/lc/subjs@latest", notes: "JS file discovery."}
  unfurl:       {stage: urls, kind: binary, tier: core, mode: passive, phase: 3, binary: unfurl, source: "go install github.com/tomnomnom/unfurl@latest", notes: "Parameter/path extraction. Pattern sorting (xss/sqli/ssrf/lfi/redirect candidates) is done in Python, no traffic."}
  urlfinder:    {stage: urls, kind: binary, tier: core, mode: passive, phase: 3, class: archive, binary: urlfinder, version_cmd: [urlfinder, -version], version_regex: 'Current [Vv]ersion: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/urlfinder/releases (or: go install github.com/projectdiscovery/urlfinder/cmd/urlfinder@latest)"}

  # ---------------- vulns (takeover, exposure) ----------------
  nuclei:       {stage: vulns, kind: binary, tier: core, mode: active, phase: 3, binary: nuclei, version_cmd: [nuclei, -version], version_regex: 'Nuclei Engine Version: (v?\d+\.\d+\.\d+)', source: "https://github.com/projectdiscovery/nuclei/releases (or: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest)", notes: "Run safe tags only (takeover, exposure, misconfig). Update templates with `nuclei -ut`."}
  subzy:        {stage: vulns, kind: binary, tier: core, mode: active, phase: 3, binary: subzy, source: "go install github.com/PentestPad/subzy@latest"}
  dnsreaper:    {stage: vulns, kind: binary, tier: core, mode: active, phase: 3, manual: true, binary: dnsreaper, source: "https://github.com/punk-security/dnsReaper (install by hand: no setup.py/pyproject.toml and no PyPI package)", notes: "Install by hand from the repo before the phase-3 adapter lands."}
  nikto:        {stage: vulns, kind: binary, tier: opt_in, mode: active, phase: 3, class: scanner, binary: nikto, version_cmd: [nikto, -Version], source: "apt: nikto", notes: "Opt-in only. Very noisy."}
  ffuf:         {stage: vulns, kind: binary, tier: opt_in, mode: active, phase: 3, binary: ffuf, version_cmd: [ffuf, -V], source: "go install github.com/ffuf/ffuf/v2@latest", notes: "Opt-in only. Content discovery needs explicit --tools ffuf."}

  # ---------------- shots ----------------
  gowitness:    {stage: shots, kind: binary, tier: opt_in, mode: active, phase: 3, binary: gowitness, source: "go install github.com/sensepost/gowitness@latest"}

  # ---------------- intrusive tier (Phase 3) ----------------
  # Exploitation-class (`exploitation: true`) tools are never selected
  # automatically, not even in full mode: only an explicit `--tools <name>` runs
  # one (docs/09, AGENTS "recon only"). See docs/02 section 2.
  dalfox:       {stage: vulns, kind: binary, tier: intrusive, mode: active, phase: 3, binary: dalfox, exploitation: true, source: "go install github.com/hahwul/dalfox/v2@latest", notes: "XSS exploitation. Only via explicit --tools."}
  crlfuzz:      {stage: vulns, kind: binary, tier: intrusive, mode: active, phase: 3, binary: crlfuzz, exploitation: true, source: "go install github.com/dwisiswant0/crlfuzz/cmd/crlfuzz@latest", notes: "CRLF injection attack. Only via explicit --tools."}
  sqlmap:       {stage: vulns, kind: binary, tier: intrusive, mode: active, phase: 3, binary: sqlmap, exploitation: true, source: "apt: sqlmap", notes: "SQL injection exploitation. Only via explicit --tools."}

system_packages: [python3, python3-venv, python3-pip, git, golang-go, libpcap-dev, jq, curl]
