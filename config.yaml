# reconkit operational config. Scope and authorization live in scope.yaml, not here.
# Every value can be overridden by a CLI flag (see docs/02_CLI_UX.md).

workspace_dir: workspaces        # raw outputs: workspaces/<target>/...
db_path: recon.db                # SQLite state (see docs/04_DATABASE.md)
results_dir: results             # saved reports: results/<domain>/<run>/ (interactive mode, docs/02 s5)
user_agent: "reconkit/{version}" # honest UA, no rotation
# Tools run at their own natural pace: there is no speed or delay setting
# (owner decision 2026-11-17, docs/MASTER_PLAN.md D3).

# Seconds. A stage is cut off at its timeout; finished tools keep their results.
timeouts:
  default_phase: 1800
  per_tool_default: 600
  subs: 900
  dns: 600
  live: 1200
  ports: 3600
  tech: 900
  urls: 1800
  url_probe: 600      # D26: the probe's own deadline; --phase-timeout overrides it
  vulns: 7200

# Per-class idle windows, in seconds (D52). A tool joins a class with one
# `class:` field in tools.yaml. There is no runtime cap: a tool runs until it
# finishes on its own, until it has been silent for its window (probably stuck,
# so it is killed and its partial output kept), or until the stage budget fires.
# A single tool overrides its class with `idle_s:` in tools.yaml.
runtime_idle:
  crawler: 60
  scanner: 120
  archive: 180
  api: 60

# URL liveness probe (D23, docs/09 section 5). One GET per stored URL that has
# no status yet; a URL that does not answer is stored as -1 and never retried.
url_probe:
  max_urls: 5000      # a bigger list is cut, and the run says so
  batch_size: 200     # URLs committed per transaction
  threads: 100        # concurrent requests (raised from 50 on 2026-11-18, D24)
  timeout_s: 10       # per-request HTTP timeout

# Saved reports (D62, docs/02 section 5). urls_max caps how many URLs one
# report lists across all hosts; 0 means no cap. A cut is always stated in the
# report itself (urls_shown / urls_truncated), so a short list is never silent.
report:
  urls_max: 0                  # 0 = no cap; one report lists every stored URL
  emit_lists: true             # subdomains/alive/dns_resolved/host-info files
  per_host_folders: true       # hosts/<hostname>/{urls.txt,info.json}
  noise_params: []             # extra marketing params to rank down (adds to the built-in list)

confidence:
  high_min_sources: 3
  medium_min_sources: 2

wildcard_check:
  enabled: true
  probes: 3

# Phase 3
webhook:
  enabled: false     # URL comes from env MONITOR_WEBHOOK_URL, never from this file
  only_on_new: true
